<svg xmlns="http://www.w3.org/2000/svg" width="440" height="300" viewBox="0 0 440 300">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f8fd6"/>
      <stop offset="1" stop-color="#bfe3f7"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a7fc0"/>
      <stop offset="1" stop-color="#0f3f6e"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9783f"/>
      <stop offset="1" stop-color="#6e3f1c"/>
    </linearGradient>
  </defs>

  <!-- sky, sun, clouds -->
  <rect width="440" height="300" fill="url(#sky)"/>
  <circle cx="360" cy="62" r="30" fill="#fff4c2"/>
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="90" cy="60" rx="46" ry="15"/>
    <ellipse cx="122" cy="50" rx="30" ry="15"/>
    <ellipse cx="250" cy="96" rx="36" ry="10"/>
  </g>

  <!-- sea -->
  <rect y="178" width="440" height="122" fill="url(#sea)"/>
  <path d="M0 178 Q30 170 60 178 T120 178 T180 178 T240 178 T300 178 T360 178 T420 178 T480 178 V186 H0 Z" fill="#5fb3e6"/>

  <!-- oar behind -->
  <line x1="268" y1="150" x2="350" y2="214" stroke="#8a5a2b" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="352" cy="216" rx="14" ry="6" fill="#8a5a2b" transform="rotate(38 352 216)"/>

  <!-- the rowboat -->
  <path d="M100 160 L340 160 Q330 206 290 214 L150 214 Q110 206 100 160 Z" fill="url(#hull)" stroke="#4a2a12" stroke-width="4" stroke-linejoin="round"/>
  <path d="M96 156 H344" stroke="#4a2a12" stroke-width="8" stroke-linecap="round"/>
  <path d="M112 182 H330 M126 200 H314" stroke="#5a3214" stroke-width="3" opacity="0.6"/>
  <!-- thwart (seat) and oarlocks -->
  <rect x="196" y="146" width="56" height="10" rx="2" fill="#9c6633" stroke="#4a2a12" stroke-width="3"/>
  <circle cx="160" cy="153" r="5" fill="#3a3a3a"/>
  <circle cx="280" cy="153" r="5" fill="#3a3a3a"/>

  <!-- oar in front -->
  <line x1="168" y1="150" x2="84" y2="220" stroke="#a06a35" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="80" cy="223" rx="15" ry="6" fill="#a06a35" transform="rotate(-40 80 223)"/>

  <!-- water at the hull, ripples -->
  <path d="M86 214 Q120 206 160 214 T240 214 T320 214 T370 212" fill="none" stroke="#d8f0ff" stroke-width="4" stroke-linecap="round"/>
  <g fill="none" stroke="#8cc9ef" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <path d="M40 246 q16 -6 32 0"/>
    <path d="M190 262 q20 -7 40 0"/>
    <path d="M360 244 q16 -6 32 0"/>
  </g>
</svg>
